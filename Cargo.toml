[package]
name = "opencalc"
version = "0.2.0-beta.1"
edition = "2024"
license = "MIT"
description = "An accessible, open-source learning calculator"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
